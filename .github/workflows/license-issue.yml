name: OZHEX License Issuance

on:
  workflow_dispatch:
    inputs:
      email:
        description: Customer email
        required: true
        type: string
      plan:
        description: License plan
        required: true
        default: Professional
        type: choice
        options: [Professional, Enterprise, MSSP]
      days:
        description: License duration in days; 0 means perpetual
        required: true
        default: "0"
        type: string
      max_activations:
        description: Maximum device activations
        required: true
        default: "3"
        type: string
      order_number:
        description: Gumroad order number
        required: false
        default: ""
        type: string
      gumroad_license:
        description: Gumroad license key; stored only as a hash in license metadata
        required: false
        default: ""
        type: string
  repository_dispatch:
    types: [gumroad-sale]

permissions:
  contents: read

jobs:
  issue:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install license dependencies
        run: python -m pip install -e .

      - name: Resolve and validate request
        id: request
        env:
          EVENT_EMAIL: ${{ github.event.client_payload.email }}
          EVENT_PLAN: ${{ github.event.client_payload.plan }}
          EVENT_DAYS: ${{ github.event.client_payload.days }}
          EVENT_MAX_ACTIVATIONS: ${{ github.event.client_payload.max_activations }}
          EVENT_ORDER: ${{ github.event.client_payload.order_number }}
          EVENT_GUMROAD_LICENSE: ${{ github.event.client_payload.gumroad_license }}
          INPUT_EMAIL: ${{ inputs.email }}
          INPUT_PLAN: ${{ inputs.plan }}
          INPUT_DAYS: ${{ inputs.days }}
          INPUT_MAX_ACTIVATIONS: ${{ inputs.max_activations }}
          INPUT_ORDER: ${{ inputs.order_number }}
          INPUT_GUMROAD_LICENSE: ${{ inputs.gumroad_license }}
        run: |
          python - <<'PY'
          import os
          def pick(event, manual, default=""):
              return event if event else (manual if manual else default)
          values = {
              "email": pick(os.environ["EVENT_EMAIL"], os.environ["INPUT_EMAIL"]).strip(),
              "plan": pick(os.environ["EVENT_PLAN"], os.environ["INPUT_PLAN"], "Professional").strip(),
              "days": pick(os.environ["EVENT_DAYS"], os.environ["INPUT_DAYS"], "0").strip(),
              "max_activations": pick(os.environ["EVENT_MAX_ACTIVATIONS"], os.environ["INPUT_MAX_ACTIVATIONS"], "3").strip(),
              "order": pick(os.environ["EVENT_ORDER"], os.environ["INPUT_ORDER"]).strip(),
              "gumroad": pick(os.environ["EVENT_GUMROAD_LICENSE"], os.environ["INPUT_GUMROAD_LICENSE"]).strip(),
          }
          if not values["email"] or "@" not in values["email"] or any(c in values["email"] for c in "\r\n"):
              raise SystemExit("A valid customer email is required")
          if values["plan"] not in {"Professional", "Enterprise", "MSSP"}:
              raise SystemExit("Unsupported license plan")
          for key in ("email", "plan", "days", "max_activations", "order", "gumroad"):
              if any(c in values[key] for c in "\r\n"):
                  raise SystemExit(f"Invalid newline in {key}")
          try:
              days = int(values["days"])
              activations = int(values["max_activations"])
          except ValueError:
              raise SystemExit("days and max_activations must be integers")
          if not 0 <= days <= 36500:
              raise SystemExit("days must be between 0 and 36500")
          if not 1 <= activations <= 1000:
              raise SystemExit("max_activations must be between 1 and 1000")
          for secret_value in (values["email"], values["order"], values["gumroad"]):
              if secret_value:
                  print(f"::add-mask::{secret_value}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              for key, value in values.items():
                  out.write(f"{key}={value}\n")
          PY

      - name: Generate signed license
        env:
          OZHEX_LICENSE_PRIVATE_KEY: ${{ secrets.OZHEX_LICENSE_PRIVATE_KEY }}
          REQUEST_EMAIL: ${{ steps.request.outputs.email }}
          REQUEST_PLAN: ${{ steps.request.outputs.plan }}
          REQUEST_DAYS: ${{ steps.request.outputs.days }}
          REQUEST_MAX_ACTIVATIONS: ${{ steps.request.outputs.max_activations }}
          REQUEST_ORDER: ${{ steps.request.outputs.order }}
          REQUEST_GUMROAD_LICENSE: ${{ steps.request.outputs.gumroad }}
        run: |
          test -n "$OZHEX_LICENSE_PRIVATE_KEY"
          python scripts/issue_license.py \
            --email "$REQUEST_EMAIL" \
            --plan "$REQUEST_PLAN" \
            --days "$REQUEST_DAYS" \
            --max-activations "$REQUEST_MAX_ACTIVATIONS" \
            --order-number "$REQUEST_ORDER" \
            --gumroad-license "$REQUEST_GUMROAD_LICENSE" \
            --output ozhex-license.lic

      - name: Secure license handoff
        env:
          LICENSE_CALLBACK_URL: ${{ secrets.OZHEX_LICENSE_CALLBACK_URL }}
          LICENSE_CALLBACK_SECRET: ${{ secrets.OZHEX_LICENSE_CALLBACK_SECRET }}
          REQUEST_EMAIL: ${{ steps.request.outputs.email }}
          REQUEST_ORDER: ${{ steps.request.outputs.order }}
        run: |
          test -n "$LICENSE_CALLBACK_URL"
          test -n "$LICENSE_CALLBACK_SECRET"
          python - <<'PY'
          import json, os
          from urllib.parse import urlsplit
          from urllib.request import Request, urlopen
          url = urlsplit(os.environ["LICENSE_CALLBACK_URL"])
          if url.scheme != "https" or not url.hostname:
              raise SystemExit("LICENSE_CALLBACK_URL must be an HTTPS URL")
          with open("ozhex-license.lic", encoding="utf-8") as handle:
              token = handle.read().strip()
          with open("ozhex-license.lic.json", encoding="utf-8") as handle:
              metadata = json.load(handle)
          payload = json.dumps({
              "token": token,
              "license_id": metadata["license_id"],
              "email": os.environ["REQUEST_EMAIL"],
              "order_number": os.environ["REQUEST_ORDER"],
          }).encode()
          req = Request(
              os.environ["LICENSE_CALLBACK_URL"],
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "Authorization": "Bearer " + os.environ["LICENSE_CALLBACK_SECRET"],
              },
              method="POST",
          )
          with urlopen(req, timeout=20) as response:
              if not 200 <= response.status < 300:
                  raise SystemExit(f"License callback failed: HTTP {response.status}")
          print("Signed license handed off to the configured HTTPS callback.")
          PY
